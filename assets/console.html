<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作区记忆</title>
<style>
:root{--bg:#0e0e13;--bg2:#14141b;--card:#191922;--card2:#1e1e29;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.14);--ink:#e8e8ef;--dim:#9a9aa8;--faint:#6b6b7a;--acc:#5b8cff;--acc-soft:rgba(91,140,255,.14);--ok:#42d392;--warn:#fbbf24;--err:#f87171;--r:10px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#1b2333 0%,transparent 60%),var(--bg);color:var(--ink);display:flex;flex-direction:column;font:13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
header{align-items:center;background:linear-gradient(180deg,rgba(255,255,255,.045),transparent);border-bottom:1px solid var(--line);display:flex;flex-shrink:0;gap:12px;padding:14px 20px}
header h1{font-size:15px;font-weight:650;letter-spacing:.2px;margin:0}
header .sub{color:var(--dim);font-size:11.5px;margin-top:3px}
.grow{flex:1;min-width:0}
.btn{align-items:center;background:var(--card2);border:1px solid var(--line2);border-radius:8px;color:var(--ink);cursor:pointer;display:inline-flex;font:inherit;font-size:12.5px;gap:6px;height:30px;padding:0 12px;transition:.14s;white-space:nowrap}
.btn:hover{background:#262633;border-color:rgba(255,255,255,.22)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:linear-gradient(180deg,#5b8cff,#4a7bf0);border-color:#5b8cff;color:#fff;font-weight:600}
.btn.primary:hover{background:linear-gradient(180deg,#6d99ff,#5585f5)}
.btn.danger{color:#ffb0b0}
.btn.ghost{background:transparent;border-color:transparent;color:var(--dim)}
.btn.ghost:hover{background:rgba(255,255,255,.07);color:var(--ink)}
.btn.sm{font-size:12px;height:26px;padding:0 9px}
main{display:flex;flex:1;min-height:0}
aside{background:linear-gradient(180deg,rgba(255,255,255,.02),transparent);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;width:250px}
aside .cap{color:var(--faint);font-size:10.5px;font-weight:600;letter-spacing:.8px;padding:12px 16px 6px;text-transform:uppercase}
.wslist{flex:1;overflow:auto;padding:0 8px 12px}
.ws{background:transparent;border:1px solid transparent;border-radius:8px;color:var(--ink);cursor:pointer;display:block;font:inherit;padding:9px 11px;text-align:left;transition:.12s;width:100%}
.ws:hover{background:rgba(255,255,255,.045)}
.ws[data-on="1"]{background:var(--acc-soft);border-color:rgba(91,140,255,.35)}
.ws .nm{display:block;font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws .mt{color:var(--dim);display:block;font-size:11px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws[data-on="1"] .mt{color:#a9c0ff}
section{display:flex;flex-direction:column;flex:1;min-width:0}
.bar{border-bottom:1px solid var(--line);flex-shrink:0;padding:12px 20px}
.bar .row1{align-items:center;display:flex;flex-wrap:wrap;gap:10px}
.path{color:var(--dim);font-family:ui-monospace,Consolas,monospace;font-size:11px;overflow-wrap:anywhere}
.chip{align-items:center;background:rgba(255,255,255,.055);border-radius:20px;color:var(--dim);display:inline-flex;font-size:11px;gap:5px;padding:2px 9px}
.chip.ok{background:rgba(66,211,146,.14);color:#8ff0c4}
.chip.warn{background:rgba(251,191,36,.14);color:#ffdc92}
.chip.info{background:rgba(91,140,255,.15);color:#a9c0ff}
.row2{align-items:center;display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
input[type=text],input[type=search],textarea,select{background:var(--bg2);border:1px solid var(--line2);border-radius:8px;color:var(--ink);font:inherit;outline:none;transition:.14s}
input[type=text],input[type=search],select{height:30px;padding:0 10px}
input:focus,textarea:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(91,140,255,.13)}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{line-height:1.65;padding:10px;resize:vertical;width:100%}
.search{flex:1;max-width:340px;min-width:160px}
.entries{flex:1;overflow:auto;padding:10px 20px 20px}
.entry{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-top:10px;padding:12px 14px;transition:.14s}
.entry:hover{background:var(--card2);border-color:rgba(255,255,255,.16)}
.entry .top{align-items:flex-start;display:flex;gap:10px}
.entry .body{flex:1;min-width:0}
.entry .sum{font-size:13.5px;line-height:1.6;overflow-wrap:anywhere}
.entry .meta{align-items:center;color:var(--faint);display:flex;flex-wrap:wrap;font-family:ui-monospace,Consolas,monospace;font-size:10.5px;gap:8px;margin-top:6px}
.tag{background:rgba(91,140,255,.13);border-radius:5px;color:#a9c0ff;font-family:inherit;font-size:10.5px;padding:1px 6px}
.acts{display:flex;gap:2px;opacity:0;transition:.14s}
.entry:hover .acts{opacity:1}
.empty{color:var(--dim);padding:60px 20px;text-align:center}
.empty b{color:var(--ink);display:block;font-size:14px;margin-bottom:6px}
footer{align-items:center;background:linear-gradient(0deg,rgba(255,255,255,.03),transparent);border-top:1px solid var(--line);display:flex;flex-shrink:0;flex-wrap:wrap;gap:10px;padding:10px 20px}
footer .stat{color:var(--dim);font-size:11.5px}
footer input[type=text]{height:28px;width:86px}
.mask{align-items:center;background:rgba(6,6,10,.72);backdrop-filter:blur(3px);display:none;inset:0;justify-content:center;position:fixed;z-index:50}
.mask[data-on="1"]{display:flex}
.modal{background:var(--card);border:1px solid var(--line2);border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.6);max-height:86vh;overflow:auto;padding:20px;width:min(720px,92vw)}
.modal h3{font-size:15px;margin:0 0 4px}
.modal .hint{color:var(--dim);font-size:12px;margin-bottom:14px}
.modal .field{margin-top:12px}
.modal label{color:var(--dim);display:block;font-size:11.5px;margin-bottom:5px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.modal .wide{width:100%}
.toast{background:#20202b;border:1px solid var(--line2);border-radius:9px;bottom:26px;box-shadow:0 10px 40px rgba(0,0,0,.5);left:50%;opacity:0;padding:10px 16px;pointer-events:none;position:fixed;transform:translate(-50%,10px);transition:.2s;z-index:60}
.toast[data-on="1"]{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:rgba(248,113,113,.5);color:#ffb4b4}
::-webkit-scrollbar{height:9px;width:9px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2)}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<header>
  <div class="grow"><h1>工作区记忆</h1><div class="sub" id="sub">加载中…</div></div>
  <button class="btn ghost" id="btnPreview">预览注入</button>
  <button class="btn ghost" id="btnManual">Memory.md</button>
  <button class="btn ghost" id="btnReload">重载数据</button>
  <button class="btn" id="btnRefresh">刷新</button>
</header>
<main>
  <aside><div class="cap">工作区</div><div class="wslist" id="wslist"></div></aside>
  <section>
    <div class="bar">
      <div class="row1"><div class="path" id="path">选一个工作区</div><div class="grow"></div><div id="chips"></div></div>
      <div class="row2">
        <input class="search" type="search" id="search" placeholder="搜索摘要 / 标签 / 正文…">
        <button class="btn primary" id="btnNew">+ 新增记忆</button>
        <span class="grow"></span>
        <select id="injectMode" title="注入到 system prompt 的方式">
          <option value="hint">注入：一行提示（默认）</option>
          <option value="index">注入：要点目录</option>
          <option value="full">注入：全文</option>
          <option value="off">不注入</option>
        </select>
        <button class="btn sm" id="btnReindex">重建索引</button>
        <button class="btn sm" id="btnResummarize">重新总结</button>
        <button class="btn sm" id="btnImport">导入会话</button>
        <button class="btn sm" id="btnMove">搬家…</button>
      </div>
    </div>
    <div class="entries" id="entries"><div class="empty">加载中…</div></div>
  </section>
</main>
<footer>
  <span class="stat" id="stat">—</span>
  <span class="grow"></span>
  <span class="stat">注入预算</span><input type="text" id="budget"><span class="stat">字</span>
  <button class="btn sm" id="btnBudget">保存</button>
  <label class="stat" style="display:inline-flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="enabled"> 本工作区启用</label>
</footer>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>
const API = location.pathname.replace(/\/page$/, "");
const $ = (id) => document.getElementById(id);
const S = { key: "", snap: null, filter: "", busy: false };

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function call(method, input) {
  const res = await fetch(API + "/" + method, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ sessionId: "", input: Object.assign({ key: S.key }, input || {}) }),
  });
  const payload = await res.json();
  if (!payload.ok) throw new Error((payload.error && payload.error.message) || "请求失败");
  return payload.value;
}

let toastTimer = 0;
function toast(text, isErr) {
  const el = $("toast");
  el.textContent = text;
  el.className = "toast" + (isErr ? " err" : "");
  el.dataset.on = "1";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.dataset.on = "0"; }, isErr ? 4200 : 2000);
}

function entrySummary(entry) {
  if (entry.summary && entry.summary !== "") return entry.summary;
  return String(entry.text || "").slice(0, 110);
}

function filteredEntries() {
  const all = (S.snap && S.snap.entries) || [];
  const q = S.filter.trim().toLowerCase();
  if (q === "") return all;
  return all.filter((e) => (String(e.summary || "") + " " + String(e.text || "") + " " + (e.tags || []).join(" ")).toLowerCase().includes(q));
}

function render() {
  const snap = S.snap;
  const rows = (snap && snap.workspaces) || [];
  $("sub").textContent = rows.length + " 个工作区" + (S.busy ? " · 处理中…" : "");
  $("wslist").innerHTML = rows.map((row) => {
    const parts = String(row.cwd || "").split(/[\\/]+/).filter(Boolean);
    const nm = parts.length ? parts[parts.length - 1] : (row.key || "未知");
    const extra = [row.count + " 条", row.alive === false ? "路径不存在" : "", row.migratedFrom ? "已迁移" : ""].filter(Boolean).join(" · ");
    return '<button class="ws" data-key="' + esc(row.key) + '" data-on="' + (row.key === S.key ? "1" : "0") + '">'
      + '<span class="nm">' + esc(nm) + '</span><span class="mt">' + esc(extra) + "</span></button>";
  }).join("");

  if (!snap || !snap.targetCwd) {
    $("path").textContent = "选一个工作区";
    $("chips").innerHTML = "";
    $("entries").innerHTML = '<div class="empty"><b>选一个工作区</b>左边列出的都是本机记录过记忆的工作区。</div>';
    $("stat").textContent = "—";
    return;
  }
  $("path").textContent = snap.targetCwd;
  const counts = snap.counts || {};
  $("chips").innerHTML = (snap.targetCwd && snap.exists === false ? '<span class="chip warn">新工作区</span>' : "")
    + '<span class="chip ' + (snap.embedder && snap.embedder.state === "ready" ? "ok" : "warn") + '">' + (snap.embedder && snap.embedder.state === "ready" ? "向量就绪" : "向量未就绪") + "</span>"
    + '<span class="chip info">浅层 ' + (counts.shallow || 0) + "/" + (snap.entries || []).length + "</span>"
    + '<span class="chip info">深层 ' + (counts.deep || 0) + "</span>";

  $("injectMode").value = snap.targetInjectMode || "hint";
  $("budget").value = String(snap.budgetChars || "");
  $("enabled").checked = snap.targetEnabled !== false;

  const list = filteredEntries();
  $("entries").innerHTML = list.length === 0
    ? (S.filter !== "" ? '<div class="empty"><b>没有匹配</b>换个词试试，或清空搜索框。</div>' : '<div class="empty"><b>这个工作区还没有记忆</b>点「+ 新增记忆」写第一条。</div>')
    : list.map((e) => {
        const tags = (e.tags || []).map((t) => '<span class="tag">' + esc(t) + "</span>").join(" ");
        const meta = [
          '<span class="pin">' + (e.pinned ? "★ 置顶" : "") + "</span>",
          e.locked ? '<span class="lock">🔒</span>' : "",
          '<span>' + esc(e.id) + "</span>",
          '<span>' + esc(String(e.updatedAt || "").slice(0, 10)) + "</span>",
          e.supersededBy ? '<span class="chip warn" style="font-size:10px;padding:0 6px">已被取代</span>' : "",
        ].filter(Boolean).join("");
        return '<div class="entry" data-id="' + esc(e.id) + '"><div class="top"><div class="body">'
          + '<div class="sum">' + esc(entrySummary(e)) + "</div>"
          + '<div class="meta">' + tags + meta + "</div>"
          + '</div><div class="acts">'
          + '<button class="btn ghost sm" data-act="pin" title="置顶 / 取消置顶">' + (e.pinned ? "★" : "☆") + "</button>"
          + '<button class="btn ghost sm" data-act="lock" title="锁定 / 解锁">' + (e.locked ? "🔓" : "🔒") + "</button>"
          + '<button class="btn ghost sm" data-act="summarize" title="重生成摘要">↻</button>'
          + '<button class="btn ghost sm" data-act="edit">编辑</button>'
          + '<button class="btn ghost sm danger" data-act="del">删除</button>'
          + "</div></div></div>";
      }).join("");

  const total = (snap.entries || []).length;
  const pending = (snap.entries || []).filter((e) => e.summaryState === "pending").length;
  $("stat").textContent = "共 " + total + " 条" + (S.filter !== "" ? "（筛出 " + list.length + "）" : "")
    + (pending > 0 ? " · " + pending + " 条摘要排队中" : "") + " · 预算 " + (snap.budgetChars || 0) + " 字";
}

async function load(key) {
  S.busy = true; render();
  try {
    let snap = await call("list", { key: key === undefined ? S.key : key });
    // 首次打开没有 key：自动落到第一个工作区（否则右边一片空白，得先手点一下）
    if ((snap.targetKey || "") === "" && Array.isArray(snap.workspaces) && snap.workspaces.length > 0) {
      snap = await call("list", { key: snap.workspaces[0].key });
    }
    S.snap = snap;
    S.key = snap.targetKey || "";
  } catch (error) {
    toast(String(error.message || error), true);
  }
  S.busy = false; render();
}

$("wslist").addEventListener("click", (ev) => {
  const btn = ev.target.closest(".ws");
  if (btn) { S.filter = ""; $("search").value = ""; load(btn.dataset.key); }
});

$("search").addEventListener("input", (ev) => { S.filter = ev.target.value; render(); });
$("btnRefresh").addEventListener("click", () => load());
$("injectMode").addEventListener("change", async (ev) => {
  try { S.snap = await call("setInjectMode", { mode: ev.target.value }); toast("注入方式已更新"); render(); }
  catch (e) { toast(String(e.message || e), true); }
});
$("enabled").addEventListener("change", async (ev) => {
  try { S.snap = await call("setEnabled", { enabled: ev.target.checked }); toast(ev.target.checked ? "已启用本工作区记忆" : "已停用"); render(); }
  catch (e) { toast(String(e.message || e), true); }
});
$("btnBudget").addEventListener("click", async () => {
  const chars = parseInt($("budget").value, 10);
  if (!Number.isFinite(chars)) { toast("预算要是数字", true); return; }
  try { S.snap = await call("setBudget", { chars }); toast("预算已保存"); render(); }
  catch (e) { toast(String(e.message || e), true); }
});
$("btnReload").addEventListener("click", async () => {
  try { await call("reloadStore", {}); toast("已从磁盘重载"); await load(); }
  catch (e) { toast(String(e.message || e), true); }
});

/* ── 条目操作 ─────────────────────────────────────── */
$("entries").addEventListener("click", async (ev) => {
  const btn = ev.target.closest("[data-act]");
  if (!btn) return;
  const card = btn.closest(".entry");
  const id = card ? card.dataset.id : "";
  const entry = ((S.snap && S.snap.entries) || []).find((e) => e.id === id);
  if (!entry) return;
  const act = btn.dataset.act;
  try {
    if (act === "pin") { S.snap = await call("update", { id, pinned: entry.pinned !== true }); render(); }
    else if (act === "lock") { S.snap = await call("update", { id, locked: entry.locked !== true }); render(); }
    else if (act === "del") {
      if (!confirm("删掉这条记忆？删了只能去 backups 里捞。")) return;
      S.snap = await call("remove", { ids: [id] }); toast("已删除"); render();
    }
    else if (act === "summarize") {
      S.snap = await call("resummarize", { id }); toast("已排队重生成摘要"); render();
    }
    else if (act === "edit") { openEditor(entry); }
  } catch (e) { toast(String(e.message || e), true); }
});

/* ── 模态框 ───────────────────────────────────────── */
function openModal(html) {
  $("modal").innerHTML = html;
  $("mask").dataset.on = "1";
}
function closeModal() { $("mask").dataset.on = "0"; $("modal").innerHTML = ""; }
$("mask").addEventListener("click", (ev) => { if (ev.target === $("mask")) closeModal(); });
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") closeModal(); });

function openEditor(entry) {
  const isNew = !entry;
  const e = entry || { text: "", summary: "", tags: [] };
  openModal('<h3>' + (isNew ? "新增记忆" : "编辑记忆") + '</h3>'
    + '<div class="hint">深层正文写完整（背景、命令、参数、结果）；要点一句话、留住能定位的关键词。</div>'
    + '<div class="field"><label>要点（一两句话，会出现在目录与检索结果里）</label><input type="text" id="fSum" class="wide" style="width:100%" value="' + esc(e.summary || "") + '"></div>'
    + '<div class="field"><label>标签（空格分隔）</label><input type="text" id="fTags" class="wide" style="width:100%" value="' + esc((e.tags || []).join(" ")) + '"></div>'
    + '<div class="field"><label>深层正文</label><textarea id="fText" rows="10">' + esc(e.text || "") + '</textarea></div>'
    + '<div class="foot"><button class="btn ghost" id="mCancel">取消</button><button class="btn primary" id="mSave">' + (isNew ? "记住" : "保存") + "</button></div>");
  $("mCancel").onclick = closeModal;
  $("mSave").onclick = async () => {
    const text = $("fText").value.trim();
    if (text === "") { toast("正文不能为空", true); return; }
    const summary = $("fSum").value.trim();
    const tags = $("fTags").value.trim().split(/\s+/).filter(Boolean);
    try {
      if (isNew) S.snap = await call("create", { text, summary, tags });
      else S.snap = await call("update", { id: entry.id, text, summary, tags });
      closeModal(); toast(isNew ? "已记住" : "已保存"); render();
    } catch (err) { toast(String(err.message || err), true); }
  };
  setTimeout(() => { const el = $("fSum"); if (el) el.focus(); }, 30);
}

$("btnNew").addEventListener("click", () => openEditor(null));

/* ── Memory.md ────────────────────────────────────── */
$("btnManual").addEventListener("click", async () => {
  try {
    const file = await call("readMemoryFile", {});
    openModal('<h3>Memory.md</h3><div class="hint">' + esc(file.path || "") + "</div>"
      + '<div class="field"><textarea id="fManual" rows="18" style="font-family:ui-monospace,Consolas,monospace;font-size:12px">' + esc(file.text || "") + "</textarea></div>"
      + '<div class="foot"><button class="btn ghost" id="mCancel2">关闭</button><button class="btn" id="mSave2">写回手记区块</button></div>');
    $("mCancel2").onclick = closeModal;
    $("mSave2").onclick = async () => {
      try { await call("writeManualBlock", { manual: $("fManual").value }); closeModal(); toast("已写回"); }
      catch (err) { toast(String(err.message || err), true); }
    };
  } catch (e) { toast(String(e.message || e), true); }
});

/* ── 预览注入 ─────────────────────────────────────── */
$("btnPreview").addEventListener("click", async () => {
  try {
    const p = await call("preview", {});
    openModal('<h3>此刻会喂给模型的内容</h3><div class="hint">注入方式：' + esc(p.injectMode || "") + " · " + (p.entries || 0) + " 条记忆</div>"
      + '<pre style="background:#0f0f14;border:1px solid var(--line);border-radius:8px;font-size:12px;line-height:1.7;max-height:50vh;overflow:auto;padding:14px;white-space:pre-wrap">' + esc(p.text || "（空）") + "</pre>"
      + '<div class="foot"><button class="btn ghost" id="mCancel3">关闭</button></div>');
    $("mCancel3").onclick = closeModal;
  } catch (e) { toast(String(e.message || e), true); }
});

/* ── 重建索引 / 重新总结 / 导入 / 搬家 ──────────────── */
$("btnReindex").addEventListener("click", async () => {
  if (!confirm("重建本工作区的两份向量？条目多时要跑一会儿。")) return;
  toast("正在重建索引…");
  try { S.snap = await call("reindex", {}); toast("索引已重建"); render(); }
  catch (e) { toast(String(e.message || e), true); }
});
$("btnResummarize").addEventListener("click", async () => {
  if (!confirm("把本工作区所有条目重新排队做 AI 摘要？")) return;
  try { S.snap = await call("resummarize", {}); toast("已排队"); render(); }
  catch (e) { toast(String(e.message || e), true); }
});

$("btnImport").addEventListener("click", async () => {
  try {
    const list = await call("importList", {});
    const items = (list.sessions || []);
    openModal('<h3>导入历史会话</h3><div class="hint">本工作区磁盘上找到 ' + items.length + " 个会话（已导入的会标注）。</div>"
      + (items.length === 0 ? '<div class="empty">没有可导入的会话</div>'
        : '<div style="max-height:46vh;overflow:auto">' + items.map((s) => '<label style="align-items:center;border-bottom:1px solid var(--line);display:flex;gap:9px;padding:8px 2px;font-size:12px">'
            + '<input type="checkbox" value="' + esc(s.id) + '"' + (s.imported ? " disabled" : "") + ">"
            + '<span style="flex:1;min-width:0;overflow-wrap:anywhere">' + esc(s.id) + (s.imported ? ' <span class="chip">已导过</span>' : "") + "</span>"
            + '<span style="color:var(--faint)">' + Math.round((s.size || 0) / 1024) + " KB</span></label>").join("") + "</div>")
      + '<div class="foot"><button class="btn ghost" id="mCancel4">取消</button><button class="btn primary" id="mImport">导入选中</button></div>');
    $("mCancel4").onclick = closeModal;
    $("mImport").onclick = async () => {
      const picked = Array.from($("modal").querySelectorAll("input[type=checkbox]:checked")).map((el) => el.value);
      if (picked.length === 0) { toast("先勾选会话", true); return; }
      closeModal(); toast("已开始导入 " + picked.length + " 个会话…");
      try { await call("importRun", { ids: picked }); setTimeout(() => load(), 4000); }
      catch (err) { toast(String(err.message || err), true); }
    };
  } catch (e) { toast(String(e.message || e), true); }
});

$("btnMove").addEventListener("click", () => {
  const rows = ((S.snap && S.snap.workspaces) || []).filter((r) => r.key !== S.key);
  if (rows.length === 0) { toast("没有别的工作区可搬", true); return; }
  openModal('<h3>把记忆搬到别的工作区</h3><div class="hint">源：' + esc((S.snap && S.snap.targetCwd) || S.key) + '。搬过去会合并去重，源工作区的这条记录会被移除。</div>'
    + '<div class="field"><label>目标工作区</label><select id="fMove" style="width:100%">'
    + rows.map((r) => '<option value="' + esc(r.key) + '">' + esc(r.cwd || r.key) + "（" + r.count + " 条）</option>").join("")
    + '</select></div><div class="foot"><button class="btn ghost" id="mCancel5">取消</button><button class="btn danger" id="mMove">确认搬家</button></div>');
  $("mCancel5").onclick = closeModal;
  $("mMove").onclick = async () => {
    const to = $("fMove").value;
    try { await call("workspaceMove", { from: S.key, to }); closeModal(); toast("已搬家"); await load(to); }
    catch (e) { toast(String(e.message || e), true); }
  };
});

load("");
console.log("console script loaded");
</script>
</body>
</html>
