<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="770" viewBox="0 0 1240 770" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A9BECE"/>
    </marker>
  </defs>
  <rect width="1240" height="770" fill="#FFFFFF"/>

  <text x="40" y="42" font-size="19" font-weight="700" fill="#16324A">会话生命周期</text>
  <text x="440" y="42" font-size="19" font-weight="700" fill="#16324A">memory_recall 的七段判断链</text>

  <!-- 左 1 注入 -->
  <rect x="40" y="64" width="340" height="96" rx="8" fill="#F7FAFD" stroke="#4A7FB5" stroke-width="1.4"/>
  <text x="56" y="90" font-size="14.5" font-weight="700" fill="#16324A">① 每轮注入</text>
  <text x="56" y="114" font-size="12.5" fill="#334B60">system prompt 只放一行提示：</text>
  <text x="56" y="134" font-size="12.5" fill="#334B60">「你有其他会话的记忆，通过</text>
  <text x="56" y="152" font-size="12.5" fill="#334B60">memory_index 查看目录」</text>
  <line x1="210" y1="160" x2="210" y2="180" stroke="#A9BECE" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 左 2 守卫 -->
  <rect x="40" y="182" width="340" height="78" rx="8" fill="#F7FAFD" stroke="#4A7FB5" stroke-width="1.4"/>
  <text x="56" y="208" font-size="14.5" font-weight="700" fill="#16324A">② 首调守卫</text>
  <text x="56" y="232" font-size="12.5" fill="#334B60">本会话第一次 pwsh / read / glob</text>
  <text x="56" y="250" font-size="12.5" fill="#334B60">还没碰过记忆工具 → deny 一次</text>
  <line x1="210" y1="260" x2="210" y2="280" stroke="#A9BECE" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 左 3 取 -->
  <rect x="40" y="282" width="340" height="118" rx="8" fill="#F7FAFD" stroke="#4A7FB5" stroke-width="1.4"/>
  <text x="56" y="308" font-size="14.5" font-weight="700" fill="#16324A">③ 取记忆（四层，够用就停）</text>
  <text x="56" y="332" font-size="12.5" fill="#334B60">memory_index　  目录</text>
  <text x="56" y="352" font-size="12.5" fill="#334B60">memory_recall　 语义找要点</text>
  <text x="56" y="372" font-size="12.5" fill="#334B60">memory_locate　 定位段号</text>
  <text x="56" y="392" font-size="12.5" fill="#334B60">memory_detail　 切片 / 全文</text>
  <line x1="210" y1="400" x2="210" y2="420" stroke="#A9BECE" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 左 4 写 -->
  <rect x="40" y="422" width="340" height="118" rx="8" fill="#F7FAFD" stroke="#4A7FB5" stroke-width="1.4"/>
  <text x="56" y="448" font-size="14.5" font-weight="700" fill="#16324A">④ 写记忆</text>
  <text x="56" y="472" font-size="12.5" fill="#334B60">抽可判别串 → 落覆盖链 → 嵌入</text>
  <text x="56" y="492" font-size="12.5" fill="#334B60">→ 原子写盘 → 重写 Memory.md</text>
  <text x="56" y="512" font-size="12.5" fill="#334B60">→ 排 AI 摘要队列</text>
  <text x="56" y="530" font-size="12.5" fill="#7A8FA3">（嵌入同步，摘要异步）</text>
  <line x1="210" y1="540" x2="210" y2="560" stroke="#A9BECE" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 左 5 存储 -->
  <rect x="40" y="562" width="340" height="118" rx="8" fill="#F4FAF6" stroke="#5C9E78" stroke-width="1.4"/>
  <text x="56" y="588" font-size="14.5" font-weight="700" fill="#1E4634">⑤ 存储（四份）</text>
  <text x="56" y="612" font-size="12.5" fill="#2F5A45">memory.json　 本体 + 覆盖链</text>
  <text x="56" y="632" font-size="12.5" fill="#2F5A45">vectors.json　浅层 / 深层向量</text>
  <text x="56" y="652" font-size="12.5" fill="#2F5A45">Memory.md　  工作区索引</text>
  <text x="56" y="672" font-size="12.5" fill="#2F5A45">backups/　   迁移前快照</text>

  <!-- 右 1 -->
  <rect x="440" y="64" width="760" height="76" rx="8" fill="#F7FAFD" stroke="#4A7FB5" stroke-width="1.4"/>
  <text x="458" y="90" font-size="14.5" font-weight="700" fill="#16324A">1　时间通道</text>
  <text x="458" y="116" font-size="12.5" fill="#334B60">认出「昨天 / 10月6日 / 九天前」→ 按本地日历日直筛，不走向量；顺带给出那天的会话 id，要追经过用 session_read（默认摘要，非原文）</text>

  <!-- 右 2 -->
  <rect x="440" y="162" width="760" height="76" rx="8" fill="#F7FAFD" stroke="#4A7FB5" stroke-width="1.4"/>
  <text x="458" y="188" font-size="14.5" font-weight="700" fill="#16324A">2　候选池</text>
  <text x="458" y="214" font-size="12.5" fill="#334B60">排除已被取代的旧版本；问的是「某次会话 / 某一天」时放宽候选范围</text>

  <!-- 右 3 -->
  <rect x="440" y="260" width="760" height="76" rx="8" fill="#F7FAFD" stroke="#4A7FB5" stroke-width="1.4"/>
  <text x="458" y="286" font-size="14.5" font-weight="700" fill="#16324A">3　向量打分 + scoreEntry 分层</text>
  <text x="458" y="312" font-size="12.5" fill="#334B60">浅层 / 深层各算一遍；深层要有资格：硬特征命中 / 要点 ≥0.45 / 段级引索能在正文定位到实词</text>

  <!-- 右 4 -->
  <rect x="440" y="358" width="760" height="76" rx="8" fill="#FAFAFA" stroke="#B9B9B9" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="458" y="384" font-size="14.5" font-weight="700" fill="#5A5A5A">4　排序增强（二者择一）</text>
  <text x="458" y="410" font-size="12.5" fill="#5A5A5A">重排优先（默认关闭，DSH_MEM_RERANK=1 才开）；默认走词法 RRF —— 与向量名次融合，折算 ≤+0.10</text>
  <text x="1170" y="384" font-size="11" fill="#9A9A9A" text-anchor="end">重排默认关</text>

  <!-- 右 5 -->
  <rect x="440" y="456" width="760" height="76" rx="8" fill="#F7FAFD" stroke="#4A7FB5" stroke-width="1.4"/>
  <text x="458" y="482" font-size="14.5" font-weight="700" fill="#16324A">5　可判别串 + 覆盖链</text>
  <text x="458" y="508" font-size="12.5" fill="#334B60">版本号 / 路径 / 端口同类型同值命中 → +≤0.12；被取代的旧版本 ×0.55 降权并在结果里标明</text>

  <!-- 右 6 -->
  <rect x="440" y="554" width="760" height="76" rx="8" fill="#F7FAFD" stroke="#4A7FB5" stroke-width="1.4"/>
  <text x="458" y="580" font-size="14.5" font-weight="700" fill="#16324A">6　没记过判定</text>
  <text x="458" y="606" font-size="12.5" fill="#334B60">top1 &lt; 0.75 且 query 里的专名在库内 DF=0 → 返回空，并说明是哪个词从没出现过</text>

  <!-- 右 7 -->
  <rect x="440" y="652" width="760" height="76" rx="8" fill="#F7FAFD" stroke="#4A7FB5" stroke-width="1.4"/>
  <text x="458" y="678" font-size="14.5" font-weight="700" fill="#16324A">7　噪音过滤</text>
  <text x="458" y="704" font-size="12.5" fill="#334B60">绝对底线 0.45 / 硬特征 / 相对长尾 / 平局 + 兄弟豁免；跑题的折成一行 id+分数留在末尾供复查</text>

  <line x1="40" y1="726" x2="1200" y2="726" stroke="#E2E8EE" stroke-width="1"/>
  <text x="40" y="750" font-size="12" fill="#8A8A8A">实线 = 当前生效的主路径</text>
  <text x="240" y="750" font-size="12" fill="#8A8A8A">灰色虚线 = 已实现但默认关闭（环境变量可开）</text>
</svg>
